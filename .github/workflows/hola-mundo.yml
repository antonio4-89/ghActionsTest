name: Aprendiendo GitHub Actions
run-name: ¡Estoy Aprendiendo GitHub Actions!
on: 
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs: 
      edad:
        description: 'Edad'
        required: true
        type: integer
      nombre:
        description: 'Tu nombre'
        required: true
        default: 'Juan'
        type: string
  schedule:
    - cron: "20 10 * * *"
jobs:
  hola-mundo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with: 
          dotnet-version: "8.0.x"
      - name: Restore dependencias
        run: dotnet restore src/MyApp
      - name: Build
        run: dotnet build src/MyApp --no-restore --configuration Release 
      - name: Test
        run: dotnet test src/MyApp --no-build --configuration Release
      - name: Ejecutar aplicación
        run: dotnet run --project src/MyApp
  greaterThan:
      if: ${{ inputs.edad > 18 }}
      runs-on: ubuntu-latest
      steps:
        - name: Correr scritp
          run: echo ${{ inputs.nombre }} es mayor
  lessThan:
      if: ${{ inputs.edad < 18 }}
      runs-on: ubuntu-latest
      steps:
        - name: Mostarr nombre
          run: echo ${{ inputs.nombre}} es menor 
      
